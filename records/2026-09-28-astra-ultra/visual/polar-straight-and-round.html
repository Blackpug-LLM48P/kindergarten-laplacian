<div id="polar-walk-v1">
  <div class="viz-row">
    <label for="polar-step" class="form-label">いっぽの長さ</label>
    <output id="polar-step-value" class="tabular-nums">1.00 m</output>
  </div>
  <input id="polar-step" class="form-range" type="range" min="0.10" max="1.60" step="0.05" value="1.00" aria-label="いっぽの長さ">
  <div id="polar-diagram"></div>
  <div class="viz-row tabular-nums" aria-live="polite">
    <span id="polar-round-distance"></span>
    <span id="polar-straight-distance"></span>
  </div>
</div>
<style>
  #polar-walk-v1 { color:var(--foreground); }
  #polar-walk-v1 .walk-svg { display:block; width:100%; }
  #polar-walk-v1 .walk-svg text { fill:var(--foreground); }
</style>
<script>
(() => {
  const root = document.getElementById('polar-walk-v1');
  const slider = root.querySelector('#polar-step');
  const value = root.querySelector('#polar-step-value');
  const host = root.querySelector('#polar-diagram');
  const straightValue = root.querySelector('#polar-straight-distance');
  const roundValue = root.querySelector('#polar-round-distance');
  const ns = 'http://www.w3.org/2000/svg';
  const R = 2;
  function draw() {
    const w = Math.max(280, host.getBoundingClientRect().width);
    const h = Math.min(360, w * 0.83 + 55);
    const scale = Math.min((w - 100) / 4.5, (h - 72) / 4.2);
    const ox = (w - 0.3 * scale) / 2;
    const oy = h / 2;
    const step = Number(slider.value);
    const px = ox + R * scale;
    const X = x => ox + x * scale;
    const Y = y => oy - y * scale;
    const svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
    svg.setAttribute('height', h);
    svg.setAttribute('class', 'walk-svg');
    svg.setAttribute('role', 'img');
    svg.setAttribute('aria-label', '中心から2メートルの出発点から、円に沿う道と接線のまっすぐな道を比較。まっすぐな道の両端は円の外にある。');
    function add(tag, attrs, txt) {
      const el = document.createElementNS(ns, tag);
      Object.entries(attrs).forEach(([k,v]) => el.setAttribute(k, v));
      if(txt !== undefined) el.textContent = txt;
      svg.appendChild(el); return el;
    }
    function line(x1,y1,x2,y2,stroke,width=1.5,dash='') {
      return add('line',{x1,y1,x2,y2,stroke,'stroke-width':width,'stroke-dasharray':dash});
    }
    function dot(x,y,fill,r=5) { add('circle',{cx:x,cy:y,r,fill}); }
    function label(x,y,text,anchor='start') { add('text',{x,y,'text-anchor':anchor},text); }
    add('circle',{cx:ox,cy:oy,r:R*scale,fill:'none',stroke:'var(--border)','stroke-width':1.5});
    line(ox,oy,px,oy,'var(--border)');
    line(ox,oy,px,Y(step),'var(--border)',1.2,'4 4');
    line(ox,oy,px,Y(-step),'var(--border)',1.2,'4 4');
    const arcPath = [];
    for(let i=0;i<=64;i++) {
      const a = (-step + 2*step*i/64) / R;
      arcPath.push(`${i===0?'M':'L'} ${X(R*Math.cos(a))} ${Y(R*Math.sin(a))}`);
    }
    add('path',{d:arcPath.join(' '),fill:'none',stroke:'var(--viz-series-2)','stroke-width':3});
    line(px,Y(step),px,Y(-step),'var(--viz-series-1)',3);
    for(const sign of [-1,1]) {
      dot(px,Y(sign*step),'var(--viz-series-1)');
      const a=sign*step/R;
      add('rect',{x:X(R*Math.cos(a))-4,y:Y(R*Math.sin(a))-4,width:8,height:8,fill:'var(--viz-series-2)'});
    }
    dot(ox,oy,'var(--foreground)',4);
    dot(px,oy,'var(--foreground)',5);
    label(ox-9,oy+22,'中心','end');
    label(px+10,oy+6,'出発点');
    label((ox+px)/2,oy+23,'2 m','middle');
    label(px,Y(step)-18,'まっすぐ','middle');
    label(X(R*Math.cos(step/R))-14,Y(-R*Math.sin(step/R))+29,'円に沿う','end');
    host.replaceChildren(svg);
    value.textContent = step.toFixed(2)+' m';
    roundValue.textContent = '円に沿う：中心から 2.000 m';
    straightValue.textContent = 'まっすぐ：中心から '+Math.hypot(R,step).toFixed(3)+' m';
  }
  slider.addEventListener('input', draw);
  new ResizeObserver(draw).observe(host);
  draw();
})();
</script>
